name: Crawl CI

on:
  push:
    branches: ["main"]
    paths:
      - "crawl/**"
      - ".github/workflows/crawl-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "crawl/**"
      - ".github/workflows/crawl-ci.yml"

jobs:
  test-crawl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crawl
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run Crawl Tests
        run: ./mvnw -B test
